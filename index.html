<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript  Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Javascript  Calculator</h1>

    <input type="number" id="firstNumber" placeholder="First number">
    <input type="number" id="secondNumber" placeholder="Second number">

    <div>
        <button class="operations" id="addButton">+</button>
        <button class="operations" id="subtractButton">-</button>
        <button class="operations" id="multiplyButton">*</button>
        <button class="operations" id="divideButton">/</button>

    </div>

    <h2>Result: <span id="result">0</span></h2>
    <h2>Calculation Hitory</h2>
    <ul id="historyList"></ul>

    <button id="clearHistory">Clear History</button>

    </div>
    <script src="script.js"></script>

</body>
</html>
